<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Task Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Focus List</h1>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
    </div>

    <form id="todoForm">
      <input 
        type="text" 
        id="todoInput" 
        placeholder="What needs to be done?" 
        autocomplete="off" 
        required 
      />
      <button type="submit" id="addBtn">Add</button>
    </form>

    <ul id="todoList" class="todo-list"></ul>

    <div class="footer">
      <span id="itemsLeft">0 tasks left</span>
      <button id="clearCompleted" class="text-btn">Clear Completed</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
